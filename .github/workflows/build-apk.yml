
name: Build JobPilot Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: jobpilot_flutter_v2
        run: |
          flutter create --platforms=android --org com.megworld --project-name jobpilot_mobile .

      # Set compileSdk to 36 and verify the result
      - name: Fix Android compile SDK
        working-directory: jobpilot_flutter_v2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          found = False

          for file in files:
              if not file.exists():
                  continue

              content = file.read_text()

              if file.name.endswith(".kts"):
                  updated, count = re.subn(
                      r'compileSdk\s*=\s*.*',
                      'compileSdk = 36',
                      content
                  )
              else:
                  updated, count = re.subn(
                      r'compileSdkVersion\s+.*',
                      'compileSdkVersion 36',
                      content
                  )

              if count > 0:
                  file.write_text(updated)
                  print(f"Updated: {file}")
                  found = True

              print(f"\n--- {file} ---")
              print(file.read_text())

          if not found:
              raise SystemExit("ERROR: Could not find compileSdk setting!")

          combined = "\n".join(
              f.read_text() for f in files if f.exists()
          )

          if not re.search(r'compileSdk\s*=\s*36|compileSdkVersion\s+36', combined):
              raise SystemExit("ERROR: compileSdk 36 was not applied!")

          print("SUCCESS: Android compileSdk is set to 36.")

      - name: Set app name
        working-directory: jobpilot_flutter_v2
        run: |
          sed -i 's/android:label="jobpilot_mobile"/android:label="JobPilot AI"/' android/app/src/main/AndroidManifest.xml

      - name: Install packages
        working-directory: jobpilot_flutter_v2
        run: flutter pub get

      - name: Build APK
        working-directory: jobpilot_flutter_v2
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JobPilot-Android-APK
          path: jobpilot_flutter_v2/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
